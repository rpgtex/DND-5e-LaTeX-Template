# CircleCI configuration file
version: 2.1

commands:
  clean_and_build:
    description: "Clean and build example document."
    parameters:
      engine:
        description: "Which engine to use for compilation."
        default: "pdflatex"
        type: string
    steps:
      - run:
          name: clean build
          command: make clean
      - run:
          name: build with << parameters.engine >>
          command: make
          environment:
            LATEX: << parameters.engine >>
